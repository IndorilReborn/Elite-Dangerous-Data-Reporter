[project]
name = "eddr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucy Ekaterina", email = "lucy@dragnof.pro" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "humanize>=4.16.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "sqlmodel>=0.0.47",
    "sv-ttk>=2.6.1",
    "watchdog>=6.0.0",
]

[project.scripts]
eddr = "eddr.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
